<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Model Inspector workflow</title>
  <desc id="desc">Comparison between manually searching model_slug in DevTools and viewing it directly in the extension panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">30 秒看懂 · Quick workflow</text>
  <text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748b">同一个动作，少走几步 / Same check, fewer repetitive steps</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="500" height="225" rx="22" fill="#ffffff"/>
    <rect x="645" y="135" width="500" height="225" rx="22" fill="#ffffff"/>
  </g>

  <text x="85" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#475569">以前 · Before</text>
  <text x="675" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f766e">现在 · Now</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">
    <rect x="85" y="210" width="92" height="48" rx="12" fill="#f1f5f9"/>
    <text x="131" y="240" text-anchor="middle">F12</text>
    <text x="191" y="240" fill="#94a3b8">→</text>
    <rect x="215" y="210" width="110" height="48" rx="12" fill="#f1f5f9"/>
    <text x="270" y="240" text-anchor="middle">Network</text>
    <text x="340" y="240" fill="#94a3b8">→</text>
    <rect x="365" y="210" width="155" height="48" rx="12" fill="#f1f5f9"/>
    <text x="442" y="232" text-anchor="middle" font-size="15">找请求</text>
    <text x="442" y="250" text-anchor="middle" font-size="12" fill="#64748b">find request</text>

    <rect x="85" y="285" width="435" height="48" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="302" y="315" text-anchor="middle" fill="#9a3412">搜索 model_slug · search response field</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="675" y="210" width="150" height="48" rx="12" fill="#ecfdf5"/>
    <text x="750" y="232" text-anchor="middle" font-size="15" fill="#065f46">正常发消息</text>
    <text x="750" y="250" text-anchor="middle" font-size="12" fill="#047857">send message</text>
    <text x="842" y="240" font-size="17" fill="#94a3b8">→</text>
    <rect x="865" y="210" width="245" height="48" rx="12" fill="#ecfdf5"/>
    <text x="987" y="232" text-anchor="middle" font-size="15" fill="#065f46">面板捕获响应</text>
    <text x="987" y="250" text-anchor="middle" font-size="12" fill="#047857">panel observes response</text>

    <rect x="675" y="285" width="435" height="48" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="892" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#115e59">直接看到 model_slug · view it directly</text>
  </g>

  <path d="M578 247 H622" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M612 237 L624 247 L612 257" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
